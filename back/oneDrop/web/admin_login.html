<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>OneDrop Admin Login</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin_login.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-text">
                    <span>One</span>
                    <span class="drop-letter"></span>
                    <span>Drop</span>
                </div>
                <p class="tagline">Admin Panel - Save Lives Together</p>
            </div>
            <form onsubmit="submitLogin(event)">
                <div class="mb-3">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@onedrop.com" required>
                </div>
                <div class="mb-3 password-toggle">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    <i id="toggleIcon" class="fas fa-eye" onclick="togglePassword()"></i>
                </div>
                <button type="submit" class="btn btn-primary mt-2">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </form>
        </div>
    </div>
<script src="assets/js/admin_login.js"></script>
</body>
</html>
